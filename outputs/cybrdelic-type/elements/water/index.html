<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cybr Elements / Archived Water Geometry</title>
  <link rel="stylesheet" href="src/viewer.css">
</head>
<body>
  <canvas id="view" aria-label="Interactive archived water geometry"></canvas>
  <header>
    <b>CYBR ELEMENTS / WATER</b>
    <a href="?variant=01">Sigil 01</a>
    <a href="?variant=02">Sigil 02</a>
    <a href="../motion/bending/sigils/02/">Current films</a>
    <a href="../">Element archive</a>
    <p id="archive-note">Archived simulation geometry · optional cache assets</p>
  </header>
  <figure id="reference">
    <img id="sigil" alt="Original sigil silhouette used to author the water source">
    <figcaption>Source silhouette</figcaption>
  </figure>
  <section id="cache-error" role="alert" hidden>
    <h1>Water geometry could not load</h1>
    <p id="error-detail"></p>
    <p>From the project checkout:</p>
    <code>python scripts/fetch_assets.py --site</code>
    <p><a href="../motion/bending/sigils/02/">Watch the current films</a> · <a href="https://github.com/cybrdelic/cybr-elements/blob/master/docs/RELEASE.md">Asset setup</a></p>
  </section>
  <footer>
    <div class="playback">
      <button id="play" disabled aria-pressed="false">Play</button>
      <input id="timeline" aria-label="Animation frame" type="range" min="0" max="0" step="1" value="0" disabled>
      <output id="status" aria-label="Playback status">Loading water geometry…</output>
    </div>
    <div class="tools">
      <label for="mode">View <select id="mode"><option value="water">Water</option><option value="wire">Wireframe</option><option value="normal">Normals</option><option value="thickness">Thickness</option><option value="whitewater">Whitewater</option><option value="particles">Primary particles</option></select></label>
      <label for="speed">Speed <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label>
      <button id="reset-camera">Reset camera</button>
    </div>
  </footer>
  <script src="vendor/three.global.js"></script>
  <script src="src/renderer.js"></script>
  <script src="src/cache-player.js"></script>
  <script src="water.js"></script>
</body>
</html>
