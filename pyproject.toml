[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cybr-elements"
version = "0.1.0"
description = "Shared portable CYBR ELEMENTS optical policies"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3"]

[tool.setuptools.packages.find]
where = ["python"]
