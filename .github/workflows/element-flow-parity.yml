name: ELEMENTS flow parity
on:
  pull_request:
    paths:
      - 'work/element-motion/element_flow.py'
      - 'work/element-motion/sigil_02_*'
      - 'work/element-motion/verify_element_flow.py'
      - 'work/element-motion/render_flow_regression.py'
      - '.github/workflows/element-flow-parity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-parity:
    name: CPU differential proof (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # The comparison loads original functions from the pinned ancestor.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.6.0 numpy==2.2.6 Pillow==11.3.0
      - name: Check generator provenance without rewriting solvers
        run: python work/element-motion/sigil_02_build_v2.py --check
      - name: Compare full solver steps and original renderers on CPU
        run: python work/element-motion/verify_element_flow.py --device cpu --report flow-parity.json
      - uses: actions/upload-artifact@v4
        with:
          name: element-flow-parity-${{ matrix.os }}
          path: flow-parity.json
