name: Elements regression
on:
  push:
    branches: [master, 'fix/elements-audit-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: elements-regression-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record immutable source snapshot
        run: |
          git archive --format=tar.gz --output=/tmp/cybr-elements-source.tar.gz HEAD
          git rev-parse HEAD > /tmp/source-commit.txt
      - uses: actions/upload-artifact@v4
        with:
          name: elements-source
          path: |
            /tmp/cybr-elements-source.tar.gz
            /tmp/source-commit.txt
          retention-days: 7
          if-no-files-found: error
      - name: Run regression tests when installed
        shell: bash
        run: |
          if [ -d tests/elements ]; then
            python -m pip install numpy scipy pillow scikit-image pytest
            python -m pytest tests/elements -q
          else
            echo 'Regression suite is being added on the audit-repair branch.'
          fi
