name: Elements CPU inputs
on:
  push:
    branches: ['fix/elements-audit-20260917']
    paths: ['.github/workflows/elements-cpu-inputs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Restore only required original inputs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          import json, hashlib, urllib.request, zipfile, collections
          root=Path('cpu-inputs'); root.mkdir()
          m=json.loads(Path('docs/assets.json').read_text())
          selected=[]
          for a in m['assets']:
              p=a['path']
              wanted=(p in ['work/element-motion/sigil-02-coherent/earth-geometry.json','work/element-motion/sigil-02-active-elements/lightning/channels.json','work/element-motion/sigil-02-v2/source.npz'] or (any('/'+x+'/' in p for x in ['sigil-02-active-elements/water-full','sigil-02-active-elements/water-cpu']) and p.endswith(('parcels.f32','guides.npz'))) or ('sigil-02-bending-ground/' in p and '/guide-' in p and ('/full/' in p or '/cpu/' in p)) or ('sigil-02-repair/scans/rock_09/' in p and p.endswith('.jpg')))
              if wanted: selected.append(a)
          groups=collections.defaultdict(list)
          for a in selected: groups[a['pack']].append(a)
          packs={p['name']:p for p in m['packs']}
          for name,assets in groups.items():
              url=f'https://github.com/{m["repository"]}/releases/download/{m["tag"]}/{name}'
              print('Fetching',name,flush=True)
              urllib.request.urlretrieve(url,name)
              raw=Path(name)
              assert hashlib.file_digest(raw.open('rb'),'sha256').hexdigest()==packs[name]['sha256']
              with zipfile.ZipFile(raw) as z:
                  for a in assets:
                      relative=PurePosixPath(a['path'])
                      assert not relative.is_absolute() and '..' not in relative.parts
                      data=z.read(a['member'])
                      assert len(data)==a['bytes'] and hashlib.sha256(data).hexdigest()==a['sha256']
                      out=root/relative;out.parent.mkdir(parents=True,exist_ok=True);out.write_bytes(data)
              raw.unlink()
          (root/'original-inputs-manifest.json').write_text(json.dumps(selected,indent=2))
          print('Verified',len(selected),'original inputs')
          PY
      - name: Obtain CPU color-management wheel
        run: python -m pip download opencolorio --no-deps --only-binary=:all: --python-version 313 --implementation cp --abi cp313 --platform manylinux_2_28_x86_64 --platform manylinux2014_x86_64 --dest cpu-inputs/wheels
      - uses: actions/upload-artifact@v4
        with:
          name: elements-cpu-original-inputs
          path: cpu-inputs/
          retention-days: 2
          if-no-files-found: error
