name: Elements CPU input recovery
on:
  push:
    branches: ['fix/elements-audit-20260917']
    paths: ['.github/workflows/elements-cpu-inputs.yml']
permissions:
  contents: read
jobs:
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Recover only required immutable assets
        shell: python
        run: |
          import pathlib, json, hashlib, urllib.request, zipfile, collections
          root=pathlib.Path('cpu-inputs');root.mkdir()
          manifest=json.loads(pathlib.Path('docs/assets.json').read_text())
          exact={'work/element-motion/sigil-02-active-elements/lightning/channels.json','work/element-motion/sigil-02-coherent/earth-geometry.json','work/element-motion/sigil-02-v2/source.npz'}
          for base in ['work/element-motion/sigil-02-active-elements/water-cpu','work/element-motion/sigil-02-active-elements/water-full']:
            exact.update(base+'/'+name for name in ['guides.npz','parcels.f32'])
          exact.update('work/element-motion/sigil-02-bending-ground/cpu/guide-'+str(i)+'.f32' for i in range(3))
          wanted=[a for a in manifest['assets'] if a['path'] in exact or (a['path'].startswith('work/element-motion/sigil-02-repair/scans/rock_09/') and a['path'].endswith('.jpg'))]
          packs={p['name']:p for p in manifest['packs']};groups=collections.defaultdict(list)
          for a in wanted: groups[a['pack']].append(a)
          for name,assets in groups.items():
            url='https://github.com/'+manifest['repository']+'/releases/download/'+manifest['tag']+'/'+name
            archive=pathlib.Path(name);urllib.request.urlretrieve(url,archive)
            assert hashlib.file_digest(archive.open('rb'),'sha256').hexdigest()==packs[name]['sha256']
            with zipfile.ZipFile(archive) as z:
              for a in assets:
                target=root/a['path'];assert target.resolve().is_relative_to(root.resolve())
                data=z.read(a['member']);assert len(data)==a['bytes'] and hashlib.sha256(data).hexdigest()==a['sha256']
                target.parent.mkdir(parents=True,exist_ok=True);target.write_bytes(data)
            archive.unlink()
          (root/'retrieval-manifest.json').write_text(json.dumps(wanted,indent=2))
          print('Verified',len(wanted),'original inputs')
      - uses: actions/upload-artifact@v4
        with:
          name: elements-cpu-inputs
          path: cpu-inputs/
          retention-days: 1
          if-no-files-found: error
