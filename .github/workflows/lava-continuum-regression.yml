name: Lava continuum regression

on:
  push:
    paths:
      - 'work/element-motion/elements_core/lava_*.py'
      - 'work/element-motion/elements_core/runtime.py'
      - 'work/element-motion/sigil_02_lava_*.py'
      - 'tests/elements/test_lava_continuum.py'
      - '.github/workflows/lava-continuum-regression.yml'
  pull_request:
    paths:
      - 'work/element-motion/elements_core/lava_*.py'
      - 'work/element-motion/elements_core/runtime.py'
      - 'work/element-motion/sigil_02_lava_*.py'
      - 'tests/elements/test_lava_continuum.py'
      - '.github/workflows/lava-continuum-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lava test dependencies
        run: python -m pip install numpy scipy numba scikit-image pytest
      - name: Compile lava entrypoints
        run: |
          python -m py_compile             work/element-motion/elements_core/runtime.py             work/element-motion/elements_core/lava_mpm.py             work/element-motion/elements_core/lava_surface.py             work/element-motion/elements_core/lava_material.py             work/element-motion/sigil_02_lava_continuum.py             work/element-motion/sigil_02_lava_surface.py             work/element-motion/sigil_02_lava_continuum_render.py
      - name: Run lava numerical regressions
        env:
          PYTHONPATH: work/element-motion
        run: python -m pytest tests/elements/test_lava_continuum.py -q
